recipe_version: "2"
model: nvidia/Qwen3.6-35B-A3B-NVFP4
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:2026072302

metadata:
  description: >-
    Qwen3.6-35B-A3B NVFP4 (ModelOpt checkpoint) + built-in MTP at nst=3 — the #74 winner config.
    Official fp8-mtp recipe shape with two deliberate swaps, both probe-isolated on 2026-07-25:
    the nvidia/ ModelOpt checkpoint (+48% over the compressed-tensors quant swap; different vLLM
    NVFP4 kernel path) and num_speculative_tokens 2 -> 3 (+19%, acceptance length 3.17).
    Container pinned per config/serving-images.env generation 2.

mods:
  - mods/fix-qwen3-coder-next
  - mods/fix-qwen3.5-chat-template

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  max_num_batched_tokens: 32768
  load_format: instanttensor
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  speculative_config: '{"method": "mtp", "num_speculative_tokens": 3}'

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code \
    --chat-template unsloth.jinja \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --attention-backend {attention_backend} \
    --speculative-config '{speculative_config}' \
    --enable-prefix-caching \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
