name: test
# Run the repo test suite (script syntax + behavioral invariants) on every push/PR so a script that
# stops parsing, or a regression in a locked-in invariant, fails before it can reach a build.
on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    - cron: '20 9 * * 1'   # Monday: the ledger byte-checks must run on a DORMANT repo too —
                           # push-only triggers make mirror/promotion drift invisible between commits
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
